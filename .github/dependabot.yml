version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ["*"]
    # typescript-eslint (via eslint-config-next) doesn't support these majors yet.
    ignore:
      - dependency-name: typescript
        versions: [">=7"]
      - dependency-name: eslint
        versions: [">=10"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
